name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run CLI test suite
        run: node --test test/cli.test.mjs
      - name: Dogfood RepoRoast action summary
        uses: ./
        with:
          target: .
          fail-under: '75'
